services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Ejecutar python scripts/configurar_env.py}
      MYSQL_DATABASE: coleccion_db
      MYSQL_USER: caso5_app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Ejecutar python scripts/configurar_env.py}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: coleccion_db
      DB_USER: caso5_app
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:?}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?}
      DEMO_GESTOR_PASSWORD: ${DEMO_GESTOR_PASSWORD:?}
      DEMO_CATALOGO_PASSWORD: ${DEMO_CATALOGO_PASSWORD:?}
    ports:
      - "8501:8501"
    restart: unless-stopped
volumes:
  mysql_data:
